name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o tajeeri_android_native_v1.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Gradle wrapper..."
          find project -name "gradlew" -type f

      - name: Build APK
        run: |
          GRADLEW=$(find project -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tajeeri-APK
          path: project/**/build/outputs/apk/**/*.apk
